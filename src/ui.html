<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch Uncle</title>
  <style>
    :root { --uncle: #fde68a; --you: #dbeafe; --ink: #1f2937; --muted: #6b7280; --err-bg: #fef2f2; --err: #b91c1c; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; color: var(--ink);
      background: #f9fafb; display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 1rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
    .bubble {
      max-width: 75%; padding: .6rem .9rem; border-radius: 1rem; line-height: 1.45;
      word-wrap: break-word;
    }
    .bubble p { margin: 0 0 .5rem; }
    .bubble p:last-child, .bubble ul:last-child { margin-bottom: 0; }
    .bubble ul { margin: 0 0 .5rem; padding-left: 1.2rem; }
    .uncle { background: var(--uncle); align-self: flex-start; border-bottom-left-radius: .25rem; }
    .you { background: var(--you); align-self: flex-end; border-bottom-right-radius: .25rem; white-space: pre-wrap; }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: .5rem; color: #78350f; font-size: .9rem; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: #92400e; opacity: .3; animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }

    /* Error notice */
    .error {
      align-self: flex-start; max-width: 75%; display: flex; align-items: center; gap: .75rem;
      background: var(--err-bg); color: var(--err); border: 1px solid #fecaca;
      padding: .5rem .75rem; border-radius: .75rem; font-size: .9rem;
    }
    .error button { background: var(--err); padding: .35rem .8rem; font-size: .85rem; }

    /* Suggestion chips */
    #chips { display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 1rem 0; background: #fff; border-top: 1px solid #e5e7eb; }
    #chips button {
      background: #fff; color: var(--ink); border: 1px solid #d1d5db; border-radius: 999px;
      padding: .35rem .8rem; font-size: .875rem;
    }
    #chips button:hover:not(:disabled) { background: #fef3c7; border-color: #f59e0b; }

    form { display: flex; gap: .5rem; padding: .75rem 1rem 1rem; background: #fff; }
    input { flex: 1; padding: .6rem .9rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: .5rem; }
    button { padding: .6rem 1.2rem; font-size: 1rem; border: 0; border-radius: .5rem; background: var(--ink); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Lunch Uncle</h1>
    <p>Tell Uncle what you feel like eating. He is at CT Hub 2, Lavender.</p>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="chips">
    <button type="button">Chicken rice nearby</button>
    <button type="button">Is it going to rain?</button>
    <button type="button">Next bus from CT Hub</button>
    <button type="button">Something cheap and fast</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Uncle, where to eat?" aria-label="Message to Uncle" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const chips = document.getElementById("chips");

    // Conversation so far, in the shape the /chat endpoint expects.
    // Only successful exchanges are added, so errors never reach the model.
    const history = [];
    let busy = false;

    function scrollDown() {
      chat.scrollTop = chat.scrollHeight;
    }

    // Escape first, then apply a small safe subset of Markdown:
    // **bold**, *italic*, "- " / "* " lists, and blank-line paragraphs.
    function renderMarkdown(text) {
      const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = (s) => escape(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");

      return text.trim().split(/\n\s*\n/).map((block) => {
        const lines = block.split("\n");
        if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
          return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`).join("") + "</ul>";
        }
        return `<p>${lines.map(inline).join("<br>")}</p>`;
      }).join("");
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      if (role === "user") {
        div.className = "bubble you";
        div.textContent = text;
      } else {
        div.className = "bubble uncle";
        div.innerHTML = renderMarkdown(text);
      }
      chat.appendChild(div);
      scrollDown();
      return div;
    }

    const THINKING_LINES = ["Uncle thinking", "Uncle checking what's nearby", "Uncle looking at the sky", "Uncle almost done"];

    function addTyping() {
      const div = document.createElement("div");
      div.className = "bubble uncle typing";
      div.setAttribute("aria-label", "Uncle is typing");
      div.innerHTML = '<span class="dots"><span></span><span></span><span></span></span><span class="label"></span>';
      const label = div.querySelector(".label");
      let i = 0;
      label.textContent = THINKING_LINES[0];
      const timer = setInterval(() => {
        i = Math.min(i + 1, THINKING_LINES.length - 1);
        label.textContent = THINKING_LINES[i];
      }, 4000);
      chat.appendChild(div);
      scrollDown();
      return () => { clearInterval(timer); div.remove(); };
    }

    function addError(text, message) {
      const div = document.createElement("div");
      div.className = "error";
      div.setAttribute("role", "alert");
      const span = document.createElement("span");
      span.textContent = text;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "Retry";
      retry.addEventListener("click", () => {
        div.remove();
        ask(message, { echo: false });
      });
      div.append(span, retry);
      chat.appendChild(div);
      scrollDown();
    }

    function setBusy(value) {
      busy = value;
      send.disabled = value;
      for (const b of chips.querySelectorAll("button")) b.disabled = value;
    }

    async function ask(message, { echo = true } = {}) {
      if (busy) return;
      setBusy(true);
      if (echo) addBubble("user", message);
      const stopTyping = addTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ history, message }),
        });
        let data = null;
        try { data = await res.json(); } catch { /* non-JSON body */ }
        stopTyping();

        if (!res.ok || !data || typeof data.reply !== "string" || !data.reply.trim()) {
          addError(data?.error ?? "Uncle cannot answer right now.", message);
          return;
        }

        addBubble("assistant", data.reply);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
      } catch {
        stopTyping();
        addError("Cannot reach Uncle. Check your connection.", message);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      ask(message);
    });

    chips.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (button) ask(button.textContent);
    });

    addBubble("assistant", "Eh, what you want to eat? Don't waste my time.");
  </script>
</body>
</html>
